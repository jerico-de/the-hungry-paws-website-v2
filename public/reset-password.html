<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - TheHungryPaws</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .reset-password-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ffc0cb 0%, #ff69b4 100%);
        padding: 20px;
      }
      .reset-password-card {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        max-width: 450px;
        width: 100%;
      }
      .reset-password-card h2 {
        color: #ff69b4;
        margin-bottom: 10px;
      }
      .reset-password-card .subtitle {
        color: #666;
        margin-bottom: 30px;
      }
      .reset-password-card label {
        display: block;
        margin-bottom: 5px;
        color: #333;
        font-weight: 500;
      }
      .reset-password-card input {
        border: 2px solid #f0f0f0;
        padding: 12px;
        border-radius: 8px;
        width: 100%;
        margin-bottom: 20px;
      }
      .reset-password-card input:focus {
        border-color: #ff69b4;
        outline: none;
      }
      .reset-password-card button {
        background: #ff69b4;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        width: 100%;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
      }
      .reset-password-card button:hover {
        background: #ff1493;
      }
      .password-requirements {
        font-size: 12px;
        color: #666;
        margin-bottom: 20px;
      }
      .password-requirements ul {
        margin: 5px 0 0 20px;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div class="reset-password-container">
      <div class="reset-password-card">
        <h2>Reset Password 🔐</h2>
        <p class="subtitle">Enter your new password</p>

        <form id="resetPasswordForm">
          <label>New Password</label>
          <input type="password" name="password" placeholder="Enter new password" required />

          <label>Confirm New Password</label>
          <input type="password" name="confirmPassword" placeholder="Confirm new password" required />

          <div class="password-requirements">
            Password must contain:
            <ul>
              <li>At least 8 characters</li>
              <li>One uppercase letter</li>
              <li>One lowercase letter</li>
              <li>One number</li>
            </ul>
          </div>

          <button type="submit">Reset Password</button>
        </form>
      </div>
    </div>

    <script>
      // Get token from URL
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");

      if (!token) {
        alert("Invalid reset link");
        window.location.href = "/";
      }

      document.getElementById("resetPasswordForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const password = e.target.password.value;
        const confirmPassword = e.target.confirmPassword.value;
        const button = e.target.querySelector("button");

        if (password !== confirmPassword) {
          alert("❌ Passwords do not match");
          return;
        }

        button.textContent = "Resetting...";
        button.disabled = true;

        try {
          const res = await fetch(`/api/auth/reset-password/${token}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password, confirmPassword }),
          });

          const result = await res.json();

          if (result.success) {
            alert("✅ " + result.message);
            window.location.href = "/";
          } else {
            alert("❌ " + result.message);
            button.textContent = "Reset Password";
            button.disabled = false;
          }
        } catch (err) {
          console.error(err);
          alert("❌ Something went wrong. Please try again.");
          button.textContent = "Reset Password";
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
