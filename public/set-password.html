<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set Password - The Hungry Paws</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7)),
          url("/images/welcome.JPEG") center/cover;
      }

      .set-password-card {
        background: white;
        border-radius: 20px;
        padding: 40px 36px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: slideUp 0.3s ease both;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .set-password-card::before {
        content: "";
        display: block;
        width: 60px;
        height: 4px;
        background: linear-gradient(90deg, #d44d7c, #f5a7c4);
        border-radius: 4px;
        margin: 0 auto 24px;
      }

      .card-icon {
        text-align: center;
        font-size: 2.5rem;
        margin-bottom: 8px;
      }

      .card-title {
        text-align: center;
        font-size: 1.6rem;
        font-weight: 700;
        color: #1a1a1a;
        margin-bottom: 6px;
      }

      .card-subtitle {
        text-align: center;
        color: #888;
        font-size: 0.9rem;
        margin-bottom: 28px;
      }

      .form-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
      }

      .form-field label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #444;
      }

      .password-wrap {
        position: relative;
      }

      .form-field input {
        width: 100%;
        padding: 11px 44px 11px 14px;
        border: 2px solid #eee;
        border-radius: 10px;
        font-size: 0.95rem;
        font-family: inherit;
        transition: 0.2s ease;
        background: #fafafa;
      }

      .form-field input:focus {
        outline: none;
        border-color: #d44d7c;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(212, 77, 124, 0.1);
      }

      .toggle-pw {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #bbb;
        display: flex;
        align-items: center;
      }

      .toggle-pw:hover {
        color: #d44d7c;
      }
      .toggle-pw svg {
        width: 18px;
        height: 18px;
      }

      .password-rules {
        background: #f9f9f9;
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 20px;
        font-size: 0.82rem;
        color: #666;
      }

      .password-rules ul {
        margin: 6px 0 0 16px;
        line-height: 1.8;
      }

      .submit-btn {
        width: 100%;
        padding: 13px;
        background: linear-gradient(135deg, #d44d7c, #e8739b);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        transition: 0.2s ease;
      }

      .submit-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(212, 77, 124, 0.35);
      }

      .submit-btn:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .skip-link {
        display: block;
        text-align: center;
        margin-top: 16px;
        color: #aaa;
        font-size: 0.85rem;
        text-decoration: none;
        cursor: pointer;
      }

      .skip-link:hover {
        color: #d44d7c;
      }

      .error-msg {
        color: #d44d7c;
        font-size: 0.85rem;
        font-weight: 600;
        text-align: center;
        margin-top: 10px;
        display: none;
      }

      .success-msg {
        color: #28a745;
        font-size: 0.85rem;
        font-weight: 600;
        text-align: center;
        margin-top: 10px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="set-password-card">
      <div class="card-icon">🔐</div>
      <h2 class="card-title">Set Your Password</h2>
      <p class="card-subtitle">You signed in with Google! Set a password so you can also log in with your email.</p>

      <div class="form-field">
        <label>New Password</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="••••••••" />
          <button type="button" class="toggle-pw" onclick="togglePw('password', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>

      <div class="form-field">
        <label>Confirm Password</label>
        <div class="password-wrap">
          <input type="password" id="confirmPassword" placeholder="••••••••" />
          <button type="button" class="toggle-pw" onclick="togglePw('confirmPassword', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>

      <div class="password-rules">
        Password must contain:
        <ul>
          <li>At least 8 characters</li>
          <li>One uppercase letter</li>
          <li>One lowercase letter</li>
          <li>One number</li>
        </ul>
      </div>

      <button class="submit-btn" id="submitBtn">Set Password & Continue</button>

      <p class="error-msg" id="errorMsg"></p>
      <p class="success-msg" id="successMsg"></p>

      <a class="skip-link">Skip for now — I'll use Google to sign in</a>
    </div>

   <script>
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get("token");
  if (token) {
    sessionStorage.setItem("jwtToken", token);
    window.history.replaceState({}, document.title, window.location.pathname);
  }

  function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const isHidden = input.type === "password";
    input.type = isHidden ? "text" : "password";
    btn.innerHTML = isHidden
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
           <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
           <line x1="1" y1="1" x2="23" y2="23"/>
         </svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
           <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
           <circle cx="12" cy="12" r="3"/>
         </svg>`;
  }

  async function setPassword() {
    const password        = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const errorMsg        = document.getElementById("errorMsg");
    const successMsg      = document.getElementById("successMsg");
    const submitBtn       = document.getElementById("submitBtn");

    errorMsg.style.display  = "none";
    successMsg.style.display = "none";

    if (!password || !confirmPassword) {
      errorMsg.textContent = "Please fill in both fields.";
      errorMsg.style.display = "block";
      return;
    }
    if (password !== confirmPassword) {
      errorMsg.textContent = "Passwords do not match.";
      errorMsg.style.display = "block";
      return;
    }

    submitBtn.disabled     = true;
    submitBtn.textContent  = "Setting password...";

    try {
      const jwt = sessionStorage.getItem("jwtToken");
      const res = await fetch("/api/auth/set-password", {
        method:  "POST",
        headers: {
          "Content-Type":  "application/json",
          "Authorization": `Bearer ${jwt}`,
        },
        body: JSON.stringify({ password, confirmPassword }),
      });
      const result = await res.json();
      if (result.success) {
        successMsg.textContent  = "✅ Password set! Redirecting...";
        successMsg.style.display = "block";
        setTimeout(() => { window.location.href = "/user"; }, 1500);
      } else {
        errorMsg.textContent   = result.message;
        errorMsg.style.display = "block";
        submitBtn.disabled     = false;
        submitBtn.textContent  = "Set Password & Continue";
      }
    } catch {
      errorMsg.textContent   = "Something went wrong. Please try again.";
      errorMsg.style.display = "block";
      submitBtn.disabled     = false;
      submitBtn.textContent  = "Set Password & Continue";
    }
  }

  // Use addEventListener instead of inline onclick
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("submitBtn")
      .addEventListener("click", setPassword);

    document.querySelector(".skip-link")
      .addEventListener("click", () => { window.location.href = "/user"; });

  
    document.querySelectorAll(".toggle-pw").forEach(btn => {
      
    });
  });
</script>
  </body>
</html>
