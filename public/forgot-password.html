<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - TheHungryPaws</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .forgot-password-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ffc0cb 0%, #ff69b4 100%);
        padding: 20px;
      }
      .forgot-password-card {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        max-width: 450px;
        width: 100%;
      }
      .forgot-password-card h2 {
        color: #ff69b4;
        margin-bottom: 10px;
      }
      .forgot-password-card .subtitle {
        color: #666;
        margin-bottom: 30px;
      }
      .forgot-password-card input {
        border: 2px solid #f0f0f0;
        padding: 12px;
        border-radius: 8px;
        width: 100%;
        margin-bottom: 20px;
      }
      .forgot-password-card input:focus {
        border-color: #ff69b4;
        outline: none;
      }
      .forgot-password-card button {
        background: #ff69b4;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        width: 100%;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
      }
      .forgot-password-card button:hover {
        background: #ff1493;
      }
      .back-to-login {
        text-align: center;
        margin-top: 20px;
      }
      .back-to-login a {
        color: #ff69b4;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="forgot-password-container">
      <div class="forgot-password-card">
        <h2>Forgot Password? 🔐</h2>
        <p class="subtitle">Enter your email and we'll send you a reset link</p>

        <form id="forgotPasswordForm">
          <input type="email" name="email" placeholder="Enter your email" required />
          <button type="submit">Send Reset Link</button>
        </form>

        <div class="back-to-login">
          <a href="/">← Back to Login</a>
        </div>
      </div>
    </div>

    <script>
      document.getElementById("forgotPasswordForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = e.target.email.value;
        const button = e.target.querySelector("button");

        button.textContent = "Sending...";
        button.disabled = true;

        try {
          const res = await fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });

          const result = await res.json();

          if (result.success) {
            alert("✅ " + result.message);
            e.target.reset();
          } else {
            alert("❌ " + result.message);
          }
        } catch (err) {
          console.error(err);
          alert("❌ Something went wrong. Please try again.");
        } finally {
          button.textContent = "Send Reset Link";
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
