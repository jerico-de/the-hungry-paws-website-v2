<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - TheHungryPaws</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      .auth-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 40%, #f48fb1 100%);
        padding: 20px;
        position: relative;
        overflow: hidden;
      }

      /* Decorative blobs */
      .auth-page::before,
      .auth-page::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        opacity: 0.25;
      }
      .auth-page::before {
        width: 400px;
        height: 400px;
        background: #d44d7c;
        top: -100px;
        right: -100px;
      }
      .auth-page::after {
        width: 300px;
        height: 300px;
        background: #f5d5d5;
        bottom: -80px;
        left: -60px;
      }

      .auth-card {
        background: #fff;
        border-radius: 20px;
        padding: 48px 40px 40px;
        width: 100%;
        max-width: 420px;
        box-shadow:
          0 20px 60px rgba(212, 77, 124, 0.18),
          0 4px 20px rgba(0, 0, 0, 0.1);
        position: relative;
        z-index: 1;
        animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      /* Top accent */
      .auth-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 4px;
        background: linear-gradient(90deg, #d44d7c, #f5a7c4);
        border-radius: 0 0 4px 4px;
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .card-icon {
        text-align: center;
        font-size: 2.8rem;
        margin-bottom: 12px;
        display: block;
      }

      .auth-card h2 {
        text-align: center;
        color: #1a1a1a;
        font-size: 1.65rem;
        font-weight: 700;
        margin: 0 0 6px;
      }

      .auth-card .subtitle {
        text-align: center;
        color: #888;
        font-size: 0.9rem;
        margin: 0 0 32px;
        line-height: 1.5;
      }

      .auth-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 18px;
      }

      .auth-field label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #444;
      }

      .auth-field input {
        padding: 12px 14px;
        border: 2px solid #eee;
        border-radius: 10px;
        font-size: 0.95rem;
        color: #333;
        background: #fafafa;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
        width: 100%;
        font-family: inherit;
      }

      .auth-field input::placeholder {
        color: #bbb;
      }

      .auth-field input:focus {
        outline: none;
        border-color: #d44d7c;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(212, 77, 124, 0.1);
      }

      .submit-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 13px 20px;
        background: linear-gradient(135deg, #d44d7c, #e8739b);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          filter 0.2s ease;
        letter-spacing: 0.02em;
        margin-bottom: 20px;
      }

      .submit-btn svg {
        width: 18px;
        height: 18px;
        transition: transform 0.2s ease;
      }

      .submit-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(212, 77, 124, 0.35);
        filter: brightness(1.05);
      }

      .submit-btn:hover:not(:disabled) svg {
        transform: translateX(3px);
      }

      .submit-btn:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .back-link {
        text-align: center;
        font-size: 0.88rem;
        color: #888;
      }

      .back-link a {
        color: #d44d7c;
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .back-link a:hover {
        opacity: 0.75;
        text-decoration: underline;
      }

      /* Success state */
      .success-state {
        display: none;
        text-align: center;
        padding: 10px 0;
        animation: cardIn 0.4s ease both;
      }

      .success-state .success-icon {
        font-size: 3rem;
        margin-bottom: 14px;
        display: block;
      }

      .success-state h3 {
        color: #1a1a1a;
        font-size: 1.3rem;
        margin-bottom: 8px;
      }

      .success-state p {
        color: #666;
        font-size: 0.9rem;
        line-height: 1.6;
        margin-bottom: 24px;
      }

      .error-msg {
        color: #d44d7c;
        font-size: 0.85rem;
        font-weight: 600;
        text-align: center;
        margin-top: 10px;
        display: none;
        animation: shake 0.3s ease;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-6px);
        }
        75% {
          transform: translateX(6px);
        }
      }

      @media (max-width: 480px) {
        .auth-card {
          padding: 36px 22px 28px;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <!-- Form State -->
        <div id="formState">
          <span class="card-icon">🔐</span>
          <h2>Forgot Password?</h2>
          <p class="subtitle">No worries! Enter your email and we'll send you a reset link.</p>

          <form id="forgotPasswordForm">
            <div class="auth-field">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
            </div>

            <button type="submit" class="submit-btn">
              <span>Send Reset Link</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M5 12h14M12 5l7 7-7 7" />
              </svg>
            </button>

            <p class="error-msg" id="errorMsg"></p>
          </form>

          <p class="back-link">
            <a href="/">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14">
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
              Back to Login
            </a>
          </p>
        </div>

        <!-- Success State -->
        <div class="success-state" id="successState">
          <span class="success-icon">📬</span>
          <h3>Check Your Inbox!</h3>
          <p>
            If an account exists for that email, we've sent a password reset link.
            <br />
            The link will expire in
            <strong>1 hour</strong>
            .
          </p>
          <p class="back-link">
            <a href="/">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14">
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
              Return to Homepage
            </a>
          </p>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("forgotPasswordForm");
      const errorMsg = document.getElementById("errorMsg");
      const formState = document.getElementById("formState");
      const successState = document.getElementById("successState");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = form.email.value.trim();
        const btn = form.querySelector(".submit-btn");
        const btnLabel = btn.querySelector("span");

        // Clear error
        errorMsg.style.display = "none";
        errorMsg.textContent = "";

        btnLabel.textContent = "Sending...";
        btn.disabled = true;

        try {
          const res = await fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });

          const result = await res.json();

          if (result.success) {
            // Show success state regardless (don't reveal if email exists)
            formState.style.display = "none";
            successState.style.display = "block";
          } else {
            errorMsg.textContent = result.message || "Something went wrong.";
            errorMsg.style.display = "block";
            btnLabel.textContent = "Send Reset Link";
            btn.disabled = false;
          }
        } catch (err) {
          console.error(err);
          errorMsg.textContent = "Something went wrong. Please try again.";
          errorMsg.style.display = "block";
          btnLabel.textContent = "Send Reset Link";
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
