<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Login — The HungryPaws</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      body {
        min-height: 100vh;
        background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.75)),
                    url("images/welcome.JPEG") center/cover no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .emp-login-card {
        background: #fff;
        border-radius: 20px;
        padding: 40px 36px 32px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(24px) scale(0.97); }
        to   { opacity: 1; transform: translateY(0)    scale(1);    }
      }

      /* top accent bar */
      .emp-login-card::before {
        content: "";
        display: block;
        width: 60px;
        height: 4px;
        background: linear-gradient(90deg, #d44d7c, #f5a7c4);
        border-radius: 0 0 4px 4px;
        margin: -40px auto 28px;
      }

      .emp-login-logo {
        display: block;
        height: 40px;
        margin: 0 auto 10px;
      }

      .emp-login-title {
        text-align: center;
        font-size: 1.5rem;
        font-weight: 700;
        color: #1a1a1a;
        margin-bottom: 4px;
      }

      .emp-login-sub {
        text-align: center;
        font-size: 0.9rem;
        color: #888;
        margin-bottom: 28px;
      }

      .emp-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
      }

      .emp-field label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #444;
      }

      .emp-field input {
        padding: 11px 14px;
        border: 2px solid #eee;
        border-radius: 10px;
        font-size: 0.95rem;
        color: #333;
        background: #fafafa;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        font-family: inherit;
        width: 100%;
      }

      .emp-field input:focus {
        outline: none;
        border-color: #d44d7c;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(212, 77, 124, 0.1);
      }

      .emp-pw-wrap { position: relative; }
      .emp-pw-wrap input { padding-right: 44px; }

      .emp-toggle-pw {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #bbb;
        display: flex;
        align-items: center;
        padding: 0;
        transition: color 0.2s;
      }

      .emp-toggle-pw:hover { color: #d44d7c; }
      .emp-toggle-pw svg   { width: 18px; height: 18px; }

      .emp-submit-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 13px 20px;
        background: linear-gradient(135deg, #d44d7c, #e8739b);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        margin-top: 8px;
        font-family: inherit;
      }

      .emp-submit-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(212, 77, 124, 0.35);
        filter: brightness(1.05);
      }

      .emp-submit-btn:disabled {
        opacity: 0.65;
        cursor: not-allowed;
        transform: none;
      }

      .emp-error {
        color: #d44d7c;
        font-size: 0.85rem;
        font-weight: 600;
        text-align: center;
        margin-top: 12px;
        display: none;
      }

      .emp-back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        font-size: 0.88rem;
        color: #888;
        text-decoration: none;
        transition: color 0.2s;
      }

      .emp-back-link:hover { color: #d44d7c; }
    </style>
  </head>
  <body>

    <div class="emp-login-card">

      <img src="images/logo.png" alt="The HungryPaws" class="emp-login-logo" />
      <h1 class="emp-login-title">Employee Portal</h1>
      <p class="emp-login-sub">Sign in with your work email and password</p>

      <div class="emp-field">
        <label for="empEmail">Email Address</label>
        <input type="email" id="empEmail" placeholder="you@thehungrypaws.ph" autocomplete="email" />
      </div>

      <div class="emp-field">
        <label for="empPassword">Password</label>
        <div class="emp-pw-wrap">
          <input type="password" id="empPassword" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="emp-toggle-pw" id="togglePw" aria-label="Toggle password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>

      <button class="emp-submit-btn" id="loginBtn">
        <span id="loginBtnText">Sign In</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </button>

      <p class="emp-error" id="errorMsg"></p>

      <a href="/" class="emp-back-link">← Back to main site</a>

    </div>

    <script>
      /* Toggle password visibility */
      document.getElementById("togglePw").addEventListener("click", () => {
        const input = document.getElementById("empPassword");
        input.type  = input.type === "password" ? "text" : "password";
      });

      /* Allow Enter key to submit */
      ["empEmail", "empPassword"].forEach(id => {
        document.getElementById(id).addEventListener("keydown", e => {
          if (e.key === "Enter") document.getElementById("loginBtn").click();
        });
      });

      /* Login */
      document.getElementById("loginBtn").addEventListener("click", async () => {
        const email    = document.getElementById("empEmail").value.trim();
        const password = document.getElementById("empPassword").value;
        const errorEl  = document.getElementById("errorMsg");
        const btn      = document.getElementById("loginBtn");
        const btnText  = document.getElementById("loginBtnText");

        errorEl.style.display = "none";

        if (!email || !password) {
          errorEl.textContent    = "Please enter your email and password.";
          errorEl.style.display  = "block";
          return;
        }

        /* Loading state */
        btn.disabled   = true;
        btnText.textContent = "Signing in…";

        try {
          const res  = await fetch("/api/auth/employee-login", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ employeeId: email, password }),
          });

          const data = await res.json();

          if (data.success) {
            window.location.href = data.redirect || "/employee-dashboard";
          } else {
            errorEl.textContent   = data.message || "Login failed. Please try again.";
            errorEl.style.display = "block";
            btn.disabled          = false;
            btnText.textContent   = "Sign In";
          }
        } catch (err) {
          errorEl.textContent   = "Something went wrong. Please try again.";
          errorEl.style.display = "block";
          btn.disabled          = false;
          btnText.textContent   = "Sign In";
        }
      });
    </script>

  </body>
</html>
